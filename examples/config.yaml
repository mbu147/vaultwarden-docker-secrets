# Optional example configuration. Everything here can also be set with
# environment variables (see README.md); copy to ./config/config.yaml to use it.

bitwarden:
  server: https://vault.example.com
  # Credentials are read from files (mount them as Docker secrets).
  # If a *_file option is omitted, BW_CLIENTID / BW_CLIENTSECRET / BW_PASSWORD
  # are used instead.
  client_id_file: /run/secrets/bw_client_id
  client_secret_file: /run/secrets/bw_client_secret
  password_file: /run/secrets/bw_password

# How often to poll Vaultwarden (minimum 10s).
interval: 5m

# Optional: trigger an immediate sync with
#   curl -X POST -H "Authorization: Bearer <token>" http://secret-sync:8080/sync
webhook:
  listen: ":8080"
  token_file: /run/secrets/sync_webhook_token

# Used to find the project directories of labeled containers. Prefer a socket
# proxy over mounting the Docker socket directly.
docker:
  host: tcp://docker-proxy:2375

# Write <working_dir>/.secrets for Compose projects whose containers
# carry the label secret-sync.env=<targets>. dir is the base directory that
# contains the projects (mounted read-write at the same path).
env_file:
  dir: /app/data/projects
  name: .secrets
  mode: "0600"

# Optional: push all synced items to Arcane as secret global variables.
# Per item, sync_arcane_agents=<id>,<id> limits them to agents and
# sync_arcane_inject_all=true injects them into all containers.
# arcane:
#   url: https://arcane.example.com
#   api_key_file: /run/secrets/arcane_api_key
#   enabled: true
