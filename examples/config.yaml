# Optional example configuration. Everything here can also be set with
# environment variables (see README.md); copy to ./config/config.yaml to use it.

bitwarden:
  server: https://vault.example.com
  # Credentials are read from files (mount them as Docker secrets).
  # If a *_file option is omitted, BW_CLIENTID / BW_CLIENTSECRET / BW_PASSWORD
  # are used instead.
  client_id_file: /run/secrets/bw_client_id
  client_secret_file: /run/secrets/bw_client_secret
  password_file: /run/secrets/bw_password

# How often to poll Vaultwarden (minimum 10s).
interval: 5m

# true:  update existing files when the vault value changes and restart
#        labeled containers
# false: write once and never overwrite (changes are only logged)
rotate: true

# Remove files that secret-sync wrote earlier but no longer produces (item
# deleted, sync_enabled removed, group changed).
prune: true

secret_dir: /secrets

# bw CLI state (login + vault cache encrypted by Bitwarden), used while the vault
# is unreachable. Mount a volume here to keep it across restarts; without one it
# is rebuilt from the vault on every start.
# data_dir: /data
file_mode: "0444"

# Optional: trigger an immediate sync with
#   curl -X POST -H "Authorization: Bearer <token>" http://secret-sync:8080/sync
webhook:
  listen: ":8080"
  token_file: /run/secrets/sync_webhook_token

# Only used to restart containers after a rotation. Prefer a socket proxy over
# mounting the Docker socket directly.
docker:
  host: tcp://docker-proxy:2375
