# Docker Compose example: secret-sync writes secrets into a shared tmpfs volume
# that consumer containers mount read-only. Nothing is stored on disk.
services:
  docker-proxy:
    image: ghcr.io/wollomatic/socket-proxy:1
    container_name: docker-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - "-listenip=0.0.0.0"
      - "-allowfrom=secret-sync"   # container name of secret-sync, nothing else may connect
      - "-allowGET=/containers/json"
      - "-allowPOST=/containers/[^/]+/(restart|kill)"
      # Swarm backend additionally needs:
      # - "-allowGET=/(secrets|services)"
      # - "-allowPOST=/(secrets/create|services/[^/]+/update)"
      # - "-allowDELETE=/secrets/[^/]+"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sync]

  secret-sync:
    container_name: secret-sync
    image: ghcr.io/mbu147/vaultwarden-docker-secrets:latest
    restart: unless-stopped
    depends_on: [docker-proxy]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    volumes:
      - ./config/config.yaml:/etc/secret-sync/config.yaml:ro
      - secrets:/secrets
    secrets: [bw_client_id, bw_client_secret, bw_password, sync_webhook_token]
    healthcheck:
      test: ["CMD", "secret-sync", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [sync]

  # Example consumer: replace with your own service. Any container that can
  # read a secret from a file works (many images support *_FILE variables).
  app:
    image: your/app:latest
    # Wait until the first sync has written all secrets.
    depends_on:
      secret-sync:
        condition: service_healthy
    volumes:
      - secrets:/run/secrets:ro
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    labels:
      # Option A: the secret is defined in config.yaml, this container is only
      # restarted when it rotates.
      secret-sync.restart: "db_password"
      # Option B (needs discovery.labels: true): define the secret right here.
      # The container is restarted on rotation automatically.
      # secret-sync.db_password.item: postgres
      # secret-sync.db_password.mode: "0444"

volumes:
  secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0755

networks:
  sync: {}

# Credentials for the Bitwarden API key login. Create the files outside of git.
secrets:
  bw_client_id:
    file: ./bootstrap/bw_client_id
  bw_client_secret:
    file: ./bootstrap/bw_client_secret
  bw_password:
    file: ./bootstrap/bw_password
  sync_webhook_token:
    file: ./bootstrap/sync_webhook_token
