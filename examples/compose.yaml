# Docker Compose example: secret-sync writes a .secrets dotenv file into
# Compose projects and/or pushes items to Arcane as global variables.
services:
  docker-proxy:
    image: ghcr.io/wollomatic/socket-proxy:1
    container_name: docker-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The proxy runs unprivileged and needs the group that owns the Docker
    # socket. Defaults to 992; override with DOCKER_GID (shell or optional .env),
    # see README ("Docker socket access").
    group_add: ["${DOCKER_GID:-992}"]
    command:
      - "-listenip=0.0.0.0"
      - "-allowfrom=secret-sync"   # container name of secret-sync, nothing else may connect
      - "-allowGET=/containers/json"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sync]

  secret-sync:
    container_name: secret-sync
    image: ghcr.io/mbu147/vaultwarden-docker-secrets:latest
    restart: unless-stopped
    depends_on: [docker-proxy]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    volumes:
      - ./config/config.yaml:/etc/secret-sync/config.yaml:ro   # optional
      # Keeps the vault cache across restarts; the volume must be writable by
      # UID 1000 (declare it under volumes: and chown it once).
      # - sync-data:/data
      # All Compose projects, read-write, at the same path Compose reports as
      # working_dir (see README).
      - /app/data/projects:/app/data/projects
    secrets: [bw_client_id, bw_client_secret, bw_password, sync_webhook_token]   # add arcane_api_key for Arcane
    environment:
      # Avoid a chicken-and-egg problem: if the vault is only reachable through a
      # reverse proxy that itself needs a synced secret, bypass the proxy. bw
      # requires https, so let Vaultwarden serve TLS itself (ROCKET_TLS with a
      # self-signed cert whose SAN is "vaultwarden") and trust that cert here:
      #   BW_SERVER: https://vaultwarden:8443
      #   NODE_EXTRA_CA_CERTS: /certs/vaultwarden.crt   (mount the cert read-only)
      BW_SERVER: https://vault.example.com
      BW_CLIENTID_FILE: /run/secrets/bw_client_id
      BW_CLIENTSECRET_FILE: /run/secrets/bw_client_secret
      BW_PASSWORD_FILE: /run/secrets/bw_password
      DOCKER_HOST: tcp://docker-proxy:2375   # used to find the project directories
      SECRET_SYNC_ENV_FILE_DIR: /app/data/projects   # write <project>/.secrets
      # ARCANE_URL: https://arcane.example.com          # push items as Arcane variables
      # ARCANE_ENABLED: "true"                           # central on/off switch
      # ARCANE_API_KEY_FILE: /run/secrets/arcane_api_key
      # SECRET_SYNC_INTERVAL: 5m
      SECRET_SYNC_WEBHOOK_LISTEN: ":8080"
      SECRET_SYNC_WEBHOOK_TOKEN_FILE: /run/secrets/sync_webhook_token
    healthcheck:
      test: ["CMD", "secret-sync", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [sync]

  # Example consumer: items with a matching group or name end up in this
  # project's .secrets file. Changes apply on recreate (docker compose up -d).
  # caddy:
  #   image: caddy:2
  #   env_file:
  #     - path: .secrets
  #       required: false   # lets the first `up` succeed before the file exists
  #   labels:
  #     secret-sync.env: "caddy"   # group, group/item or item

networks:
  sync: {}

# Credentials for the Bitwarden API key login. Create the files outside of git.
secrets:
  bw_client_id:
    file: ./bootstrap/bw_client_id
  bw_client_secret:
    file: ./bootstrap/bw_client_secret
  bw_password:
    file: ./bootstrap/bw_password
  sync_webhook_token:
    file: ./bootstrap/sync_webhook_token
  # arcane_api_key:
  #   file: ./bootstrap/arcane_api_key
