# Docker Compose example: secret-sync writes secrets into a shared tmpfs volume
# that consumer containers mount read-only. Nothing is stored on disk.
services:
  docker-proxy:
    image: ghcr.io/wollomatic/socket-proxy:1
    container_name: docker-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The proxy runs unprivileged and needs the group that owns the Docker
    # socket. Defaults to 992; override with DOCKER_GID (shell or optional .env),
    # see README ("Docker socket access").
    group_add: ["${DOCKER_GID:-992}"]
    command:
      - "-listenip=0.0.0.0"
      - "-allowfrom=secret-sync"   # container name of secret-sync, nothing else may connect
      - "-allowGET=/containers/json"
      - "-allowPOST=/containers/[^/]+/restart"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sync]

  secret-sync:
    container_name: secret-sync
    image: ghcr.io/mbu147/vaultwarden-docker-secrets:latest
    restart: unless-stopped
    depends_on: [docker-proxy]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
    volumes:
      - ./config/config.yaml:/etc/secret-sync/config.yaml:ro   # optional
      - secrets:/secrets
    secrets: [bw_client_id, bw_client_secret, bw_password, sync_webhook_token]
    environment:
      # Avoid a chicken-and-egg problem: if the vault is only reachable through a
      # reverse proxy that itself needs a synced secret, bypass the proxy. bw
      # requires https, so let Vaultwarden serve TLS itself (ROCKET_TLS with a
      # self-signed cert whose SAN is "vaultwarden") and trust that cert here:
      #   BW_SERVER: https://vaultwarden:8443
      #   NODE_EXTRA_CA_CERTS: /certs/vaultwarden.crt   (mount the cert read-only)
      BW_SERVER: https://vault.example.com
      BW_CLIENTID_FILE: /run/secrets/bw_client_id
      BW_CLIENTSECRET_FILE: /run/secrets/bw_client_secret
      BW_PASSWORD_FILE: /run/secrets/bw_password
      DOCKER_HOST: tcp://docker-proxy:2375   # only needed for restarts
      # SECRET_SYNC_INTERVAL: 5m
      # SECRET_SYNC_ROTATE: "true"
      SECRET_SYNC_WEBHOOK_LISTEN: ":8080"
      SECRET_SYNC_WEBHOOK_TOKEN_FILE: /run/secrets/sync_webhook_token
    healthcheck:
      test: ["CMD", "secret-sync", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [sync]

  # Example consumer. In Vaultwarden the item "mariadb-root" has the custom
  # fields sync_enabled=true and group=mariadb, which creates
  # /secrets/mariadb/mariadb-root/password.
  mariadb:
    image: mariadb:11
    # Wait until the first sync has written all secrets.
    depends_on:
      secret-sync:
        condition: service_healthy
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets          # sees only the "mariadb" group
        read_only: true
        volume:
          subpath: mariadb
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb-root/password
    labels:
      # Restart this container when a secret of the group "mariadb" changes.
      # Optional; use "<group>/<item>" to react to a single item only.
      secret-sync.restart: "mariadb"

volumes:
  secrets:
    # Fixed name: without it Compose names the volume <project>_secrets. With it,
    # consumers in other compose projects can mount it as an external volume.
    name: secrets
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0755

# Consumers in OTHER compose projects declare the same volume as external
# (the volume is created by this file, so start secret-sync first):
# volumes:
#   secrets:
#     external: true

networks:
  sync: {}

# Credentials for the Bitwarden API key login. Create the files outside of git.
secrets:
  bw_client_id:
    file: ./bootstrap/bw_client_id
  bw_client_secret:
    file: ./bootstrap/bw_client_secret
  bw_password:
    file: ./bootstrap/bw_password
  sync_webhook_token:
    file: ./bootstrap/sync_webhook_token
